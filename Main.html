<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackTheWorld - Incremental</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- Modal de Sélection du Pays d'Origine -->
    <div id="country-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>[ SÉLECTION DU PAYS D'ORIGINE ]</h2>
            <p>Choisis ta base d'opérations stratégique :</p>
            <select id="country-select"></select>
            <div id="country-stats-preview"></div>
            <button id="confirm-country-btn">INITIALISER L'INFILTRATION</button>
        </div>
    </div>

    <div class="container">
        <h1>[ HACK_THE_WORLD // SYS_READY ]</h1>
        
        <p>> Infiltrated Data: <span id="data-counter">0 B</span></p>
        <p>> Current Bitrate: <span id="bps-counter">0 B</span>/s</p>

        <!-- Panneau de Menaces : Infection et Antivirus -->
        <div class="threat-panel">
            <div class="progress-container">
                <label>PIRATAGE DU MONDE : <span id="infection-text">0.00%</span></label>
                <div class="progress-bar"><div id="infection-fill" class="fill-green"></div></div>
            </div>
            <div class="progress-container">
                <label>ANTIVIRUS MONDIAL : <span id="antivirus-text">0.00%</span> <span id="lockdown-badge" class="badge-danger hidden">LOCKDOWN DÉTECTÉ</span></label>
                <div class="progress-bar"><div id="antivirus-fill" class="fill-red"></div></div>
            </div>
        </div>

        <!-- Actions de Contre-mesures Joueur -->
        <div class="countermeasures-panel">
            <button id="buy-encryption-btn">Chiffrement Polymorphe (Coût: <span id="enc-cost">1000</span> B)</button>
            <button id="ddos-attack-btn">Attaque DDOS Antivirus (-5% AV) (Coût: <span id="ddos-cost">5000</span> B)</button>
            <button id="zero-day-btn">Exploit Zero-Day (+2% Infection) (Coût: <span id="zeroday-cost">10000</span> B)</button>
        </div>
        
        <button id="click-btn" class="full-width margin-top-15">EXECUTE: exploit.exe</button>
        <button id="upgrade-click-btn" class="full-width">
            <span>UPGRADE: CPU Overclock</span>
            <span class="price-tag" id="click-upgrade-cost">Cost: 50 B</span>
        </button>

        <div class="multiplier-bar">
            <span>BUY AMOUNT:</span>
            <button id="mult-1" class="active-multiplier">x1</button>
            <button id="mult-10">x10</button>
            <button id="mult-100">x100</button>
        </div>

        <div class="shop-section">
            <button id="buy-miner-btn"></button>
            <button id="buy-trojan-btn"></button>
            <button id="buy-ransomware-btn"></button>
            <button id="buy-boot-btn"></button>
            <button id="buy-file-btn"></button>
            <button id="buy-macro-btn"></button>
            <button id="buy-resident-btn"></button>
            <button id="buy-multipartite-btn"></button>
            <button id="buy-polymorphic-btn"></button>
        </div>

        <button id="open-skilltree-btn" class="full-width margin-top-15 skilltree-btn" onclick="window.location.href='skill_tree.html'">
            <span>[ MATRIX SKILLS ]</span>
        </button>

        <div id="console-log">
            <div>> System initialized. Ready for deployment...</div>
        </div>

        <div class="save-zone">
            <div class="save-row">
                <input type="text" id="save-name-input" placeholder="Enter save name...">
                <button id="save-btn" class="save-btn">SAVE MATRIX</button>
            </div>
            <div class="save-row">
                <select id="save-select">
                    <option value="">-- Select a file --</option>
                </select>
                <button id="load-btn">LOAD MATRIX</button>
            </div>
            <button id="reset-btn" class="reset-btn">WIPE ALL SAVES</button>
        </div>
    </div>

    <script src="countries_data.js"></script>
    <script src="shared_state.js"></script>
    <script src="skill_tree.js"></script>
    <script src="game.js"></script>
</body>
</html>
